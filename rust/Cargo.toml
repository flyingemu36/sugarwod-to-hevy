[workspace]
resolver = "2"
members = [
    "crates/swh-core",
    "crates/sync-wod",
    "crates/refresh-catalog",
    "crates/refresh-maxes",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"
authors = ["Eamun Rahimi <eamun@eamunrahimi.com>"]
repository = "https://github.com/flyingemu36/sugarwod-to-hevy"
homepage = "https://github.com/flyingemu36/sugarwod-to-hevy"
keywords = ["crossfit", "hevy", "sugarwod", "aws-lambda", "serverless"]
categories = ["command-line-utilities"]
description = "Turns a gym's daily SugarWOD workout into a ready-to-run Hevy routine, with loads filled in from your own lift history."

[workspace.dependencies]
swh-core = { path = "crates/swh-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
lambda_runtime = "1.4"
aws-config = { version = "1", features = ["credentials-login"] }
aws-sdk-dynamodb = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-ssm = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
