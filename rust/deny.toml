# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# The point of the licenses check here is one specific risk: this project is AGPL-3.0-or-later,
# and AGPL is incompatible with several licenses that are otherwise common and harmless
# (notably the original OpenSSL license, with its advertising clause). Today the whole tree is
# permissive, so a future dependency introducing an incompatible license should fail the build
# rather than quietly making the project undistributable.

[licenses]
# Every license currently present in the dependency tree. All are one-way compatible with
# AGPL-3.0 — i.e. they can be combined into an AGPL work.
allow = [
    # This project's own crates.
    "AGPL-3.0-or-later",
    # Dependencies — all one-way compatible with AGPL-3.0.
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
# `cargo deny check advisories` is intentionally not part of the license CI job — advisory
# databases change without any commit to this repo, which would turn green builds red on
# unrelated days. Run it manually, or wire it to a scheduled job if you want the signal.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
