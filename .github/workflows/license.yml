name: License compatibility

on:
  push:
    branches: [main]
  # Deliberately unfiltered. This job's check is a *required* status check, and a required
  # check that only runs on some paths never reports on the others — leaving those pull
  # requests waiting forever for a result that will not arrive. `cargo deny check licenses`
  # resolves manifests without compiling and takes about a second, so running it on every
  # pull request costs nothing next to being unmergeable.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: cargo-deny (licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This project is AGPL-3.0-or-later. AGPL is incompatible with a handful of otherwise
      # common licenses, so a new dependency carrying one would quietly make the project
      # undistributable. Failing here is much cheaper than finding out later.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check licenses
